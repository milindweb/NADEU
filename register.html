<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a3a5f">
  <title>Register - NAD Employees Union</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="data/manifest.json">
  <link rel="icon" type="image/png" sizes="48x48" href="img/favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p class="auth-sub">Register for NAD Employees Union</p>

      <form id="registerForm" novalidate>
        <div class="auth-field">
          <label for="regUsername">Username</label>
          <input type="text" id="regUsername" name="username" autocomplete="username" minlength="3" required autofocus>
        </div>
        <div class="auth-field">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" name="name" autocomplete="name" required>
        </div>
        <div class="auth-field">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" name="email" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="regMobile">Mobile No.</label>
          <input type="tel" id="regMobile" name="mobile" autocomplete="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" required>
        </div>
        <div class="auth-field">
          <label for="regPassword">Password</label>
          <div class="auth-pw-wrap">
            <input type="password" id="regPassword" name="password" autocomplete="new-password" minlength="4" required>
            <button type="button" class="pw-toggle" id="pwToggle1" aria-label="Toggle password visibility">&#128065;</button>
          </div>
        </div>
        <div class="auth-field">
          <label for="regConfirm">Confirm Password</label>
          <div class="auth-pw-wrap">
            <input type="password" id="regConfirm" name="confirm" autocomplete="new-password" minlength="4" required>
            <button type="button" class="pw-toggle" id="pwToggle2" aria-label="Toggle password visibility">&#128065;</button>
          </div>
        </div>
        <button type="submit" class="auth-btn" id="registerBtn">Register</button>
        <div class="auth-msg" id="authMsg"></div>
      </form>

      <div class="auth-link">
        Already have an account? <a href="login.html">Sign In</a>
      </div>

      <div class="auth-footer">
        After registration, contact NAD Employees Union President or Secretary for account approval
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
