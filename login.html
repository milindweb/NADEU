<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a3a5f">
  <title>Login - NAD Employees Union</title>
  <script src="js/config.js"></script>
  <script>const PAGE_CONFIG = { title: 'Login', description: 'Sign in to NAD Employees Union Receipt Management System.', canonical: '/login' };</script>
  <script src="js/seo-injector.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/headerfooter.css">
  <link rel="manifest" href="data/manifest.json">
  <link rel="icon" type="image/png" sizes="48x48" href="img/favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">
  <div id="header"></div>

  <div class="auth-page">
    <div class="auth-card">
      <h1>NAD Employees Union</h1>
      <p class="auth-sub">Sign in to your account</p>

      <form id="loginForm" novalidate>
        <div class="auth-field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <div class="auth-pw-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Toggle password visibility">&#128065;</button>
          </div>
        </div>
        <div class="auth-field-check">
          <input type="checkbox" id="rememberMe" name="rememberMe" checked>
          <label for="rememberMe">Remember me</label>
        </div>
        <div class="auth-forgot">
          <a href="forgot-password.html" id="forgotPwd">Forgot password?</a>
        </div>
        <button type="submit" class="auth-btn" id="loginBtn">Sign In</button>
        <div class="auth-msg" id="authMsg"></div>
      </form>

      <div class="auth-link">
        Don't have an account? <a href="register.html">Register</a>
      </div>

      <div class="auth-footer">
        After sign in, contact NAD Employees Union President or Secretary for account approval
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="js/headerfooter.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
