<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a3a5f">
  <title>Forgot Password - NAD Employees Union</title>
  <script src="js/config.js"></script>
  <script>const PAGE_CONFIG = { title: 'Forgot Password', description: 'Reset your password for NAD Employees Union Receipt Management System.', canonical: '/forgot-password' };</script>
  <script src="js/seo-injector.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/headerfooter.css">
  <link rel="manifest" href="data/manifest.json">
  <link rel="icon" type="image/png" sizes="48x48" href="img/favicon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
  <script src="js/headerfooter.js" defer></script>
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">
  <div id="header"></div>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Forgot Password</h1>
      <p class="auth-sub">Enter your username or email to request a password reset</p>

      <form id="forgotForm" novalidate>
        <div class="auth-field">
          <label for="forgotIdentifier">Username or Email</label>
          <input type="text" id="forgotIdentifier" name="identifier" autocomplete="username" placeholder="Enter username or email" required autofocus>
        </div>
        <button type="submit" class="auth-btn" id="forgotBtn">Send Reset Request</button>
        <div class="auth-msg" id="authMsg"></div>
      </form>

      <div class="auth-link">
        <a href="login.html">Back to Sign In</a>
      </div>

      <div class="auth-footer">
        A temporary password will be generated. Contact the President or Secretary to receive it.
      </div>
    </div>
  </div>
  <div id="footer"></div>

  <script src="js/api-client.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var form = document.getElementById('forgotForm');
      var btn = document.getElementById('forgotBtn');
      var msg = document.getElementById('authMsg');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var identifier = document.getElementById('forgotIdentifier').value.trim();

        if (!identifier) {
          msg.className = 'auth-msg error';
          msg.textContent = 'Please enter your username or email.';
          return;
        }

        msg.className = 'auth-msg';
        msg.textContent = 'Sending request...';
        btn.disabled = true;

        API.forgotPassword(identifier).then(function (res) {
          msg.className = 'auth-msg success';
          msg.textContent = res.message || 'Reset request sent. Contact the President or Secretary for your temporary password.';
        }).catch(function (err) {
          msg.className = 'auth-msg error';
          msg.textContent = err.message || 'Request failed. Please try again.';
        }).finally(function () {
          btn.disabled = false;
        });
      });
    });
  </script>
</body>
</html>
