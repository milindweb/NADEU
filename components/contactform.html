<div class="contact-section" style="max-width:600px;margin:2rem auto;padding:0 1rem;">
  <h2 style="text-align:center;margin-bottom:1rem;color:var(--accent);">Contact Us</h2>
  <form id="contactForm" novalidate style="display:flex;flex-direction:column;gap:1rem;">
    <div class="auth-field">
      <label for="cfName">Name</label>
      <input type="text" id="cfName" name="name" required placeholder="Your name">
    </div>
    <div class="auth-field">
      <label for="cfEmail">Email</label>
      <input type="email" id="cfEmail" name="email" required placeholder="you@example.com">
    </div>
    <div class="auth-field">
      <label for="cfSubject">Subject</label>
      <input type="text" id="cfSubject" name="subject" required placeholder="Subject">
    </div>
    <div class="auth-field">
      <label for="cfMessage">Message</label>
      <textarea id="cfMessage" name="message" rows="4" required placeholder="Your message..."></textarea>
    </div>
    <button type="submit" class="auth-btn" id="cfBtn">Send Message</button>
    <div class="auth-msg" id="cfMsg"></div>
  </form>
</div>
